<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We will be right back</title>
    <link rel="stylesheet" href="errors/styles.css">
    <style>
        body {
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            text-align: center;
        }

        main {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            width: min(560px, 100%);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            box-shadow: var(--shadow-lg);
            display: grid;
            gap: 18px;
            justify-items: center;
        }

        .status-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--ink-900);
            letter-spacing: 0.01em;
        }

        .status-subtitle {
            color: var(--ink-700);
            font-size: 1.05rem;
        }

        .status-image {
            width: 180px;
            height: 180px;
            object-fit: contain;
            animation: spin 7s linear infinite;
            filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.16));
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<main>
    <section class="error-card" aria-labelledby="status-title">
        <p class="status-title" id="status-title">The pets will be right back!</p>
        <p class="status-subtitle">they are tired from all the petting and need to take a nap.</p>
        <img class="status-image" src="/errors/DAISY.png" alt="Spinning status graphic">
        <p class="status-subtitle">thank you for your patience</p>
    </section>
</main>
</body>
</html>
