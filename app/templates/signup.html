{{ define "title" }}Pet Everyone{{ end }}

{{ define "content" }}
    <div id="signup-form-container">
        <form id="signup-form">
            <h1>Sign up</h1>
            <label for="display-name-input">Display name</label>
            <input type="text" id="display-name-input" minlength="1" maxlength="20" pattern="^[A-Za-z0-9_]{1,20}$" required />
            <label for="email-input">Email</label>
            <input type="email" id="email-input" required/>
            <label for="password-input">Password</label>
            <input type="password" minlength="8" max="32" id="password-input" required/>
            <button type="submit" id="signup-button">Sign up</button>
        </form>
    </div>
    <script src="/app/js/signup.js"></script>
{{ end }}
