{{ define "title" }}Pet Everyone{{ end }}

{{ define "content" }}
    {{ $numPets := len .Pets }}
    <h1 style="text-align: center;">Welcome to our Zoo of {{ $numPets}} Pets</h1>
        <div id="pet-card-container">
            <div class="card-container">
                {{ range .Pets }}
                <!-- CARD -->
                <div class="card pet-card">
                    <h3 class="card-title">{{ .PetName }}</h3>
                    <img class="card-image" src="{{ .ImageURL }}"></img>
                    <p>Total pets: {{ .PetCount }}</p>
                    <p>Active petters: 10</p>
                    <a class=btn href="/pet/{{ .PetID }}">Pet</a>
                </div>
                <!-- END CARD -->
                {{ end }}
            </div>

        </div>
    <script src="/app/js/app.js"></script>
{{ end }}
