{{ define "title" }}Pet {{ .PetName }}{{ end }}

{{ define "content" }}
    <h1>{{ .PetName }}</h1>

    <img src="{{ .ImageURL }}" alt="{{ .PetName }}">

    <script>
		const pet_id = {{ .PetID }};
		const ws = new WebSocket(`ws://localhost:8082/pet/${pet_id}/ws`);

		ws.onopen = () => {
			console.log("Connected successfully");
		};

		ws.onmessage = (data) => {
			console.log(data);
		};
    </script>
{{ end }}
