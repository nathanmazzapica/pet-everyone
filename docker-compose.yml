services:
  postgres:
    image: postgres:16
    container_name: pet_everyone-postgres
    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d devdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:latest
    container_name: pet_everyone-cache
    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "cache-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


volumes:
  pgdata:


